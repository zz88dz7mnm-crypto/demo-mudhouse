<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8" />
  <title>Mudhouse Bakery & Coffee · Ya viene</title>
  <meta name="description" content="Mudhouse Bakery & Coffee — la página está en construcción." />
  <meta name="theme-color" content="#c8542c" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="crossorigin" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,800&display=swap" rel="stylesheet" />
  <style>
    html,body{margin:0;height:100%;}
    body{
      background:#c8542c;
      color:#17130f;
      font-family:'Bricolage Grotesque',system-ui,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:24px;
    }
    .card{
      background:#fff4e6;
      border:4px solid #17130f;
      border-radius:6px;
      box-shadow:10px 10px 0 #17130f;
      padding:clamp(28px,6vw,64px);
      max-width:620px;
    }
    img{width:clamp(90px,18vw,140px);height:auto;display:block;margin:0 auto 22px;border-radius:50%;border:4px solid #17130f;}
    h1{font-size:clamp(30px,6vw,52px);line-height:1.05;letter-spacing:-0.02em;font-weight:800;margin:0 0 14px;}
    p{font-size:clamp(16px,2.4vw,20px);line-height:1.5;margin:0;color:#3a291d;}
    .tag{display:inline-block;margin-top:22px;font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;background:#17130f;color:#fff4e6;padding:8px 16px;border-radius:999px;}
  </style>
</head>
<body>
  <div class="card">
    <img src="assets/img/logo-mudhouse.png" alt="Mudhouse Bakery & Coffee" />
    <h1>Mudhouse Bakery &amp; Coffee</h1>
    <p>Estamos horneando la página nueva: carta de Mud Cookies, locales y horarios. Volvé en un rato.</p>
    <span class="tag">Ya casi está</span>
  </div>
</body>
</html>
